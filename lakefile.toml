# NOTE (CI establishment, 2026-08-27): every `[[lean_exe]]` below previously carried
# `moreLinkArgs = ["-Wl,--subsystem,console"]`. That flag is a PE/COFF-only linker option
# (meaningful to lld-link / MinGW's `ld`); GNU ld's ELF backend on Linux does not recognize
# it and fails the link. Empirically (see docs/CI.md "Linux platform coverage") removing it
# changes nothing observable on Windows: `lake build` still succeeds for all targets and a
# spot-checked executable (`test_smolalloc`) still runs, prints its full console output, and
# exits with the same code with the flag absent as with it present -- Lean/Lake's default
# link already produces a console-subsystem binary on Windows, making the flag redundant
# there. Removing it is what allows `lake build`'s executables to link at all on Linux.
name = "gasm"
version = "0.1.0"
defaultTargets = [
  "Gasm", "Spikes", "Stdlib", "GateSubprocess",
  "X86DispatchExhaustive", "X86InstructionCensusControls", "X86InstructionCensusIsolation",
  "check_gates_axioms", "check_refs_coverage_full"
]

[[lean_lib]]
name = "Gasm"
roots = ["Gasm"]

[[lean_lib]]
name = "Spikes"
roots = ["Spikes"]

[[lean_lib]]
name = "Stdlib"
roots = ["Stdlib"]

# Shared per-module standalone-scan subprocess protocol used by both
# check_gates_axioms and check_refs_coverage_full's `--scan-module` worker mode.
# See Tools/GateSubprocess.lean's own header for why this much (and no
# more) is shared between the two gate tools.
[[lean_lib]]
name = "GateSubprocess"
roots = ["Tools.GateSubprocess"]

# Expensive exhaustive decoder proof kept as a separate root so ordinary Gasm
# edit dependencies do not import it, while the default trust build still
# kernel-checks it and the gate scanners can load its declarations.
[[lean_lib]]
name = "X86DispatchExhaustive"
roots = ["Gasm.Targets.X86_64.RoundtripGate.DispatchExhaustive"]

# Hostile real-instance controls for the compiled x86 census. This is a default gate root but is
# deliberately absent from every library umbrella: it registers an overlapping wrapper instance
# whose rejection is the test, so importing it into Gasm would pollute the delivered environment.
[[lean_lib]]
name = "X86InstructionCensusControls"
roots = ["Gasm.Targets.X86_64.InstructionCensusControls"]

# Compiles the real production Gasm umbrella and asserts that no direct or transitive route leaks
# the hostile control instance into its environment.
[[lean_lib]]
name = "X86InstructionCensusIsolation"
roots = ["Tools.X86InstructionCensusIsolation"]

# Law 10 axiom-level gate verifier: walks every compiled declaration in
# Gasm/Stdlib/Spikes and cross-checks its axiom dependencies (Lean's own
# `#print axioms` machinery) with zero exception-ledger support. See
# Tools/CheckGatesAxioms.lean for why this, and not the Python regex
# pre-check, is the load-bearing gate.
[[lean_exe]]
name = "check_gates_axioms"
root = "Tools.CheckGatesAxioms"

# Law 1 / Law 3 declaration-coverage gate verifier: walks every compiled
# declaration in Gasm/Stdlib/Spikes and requires a preceding `REF:` citation.
# See Tools/CheckRefsCoverage.lean
# for why this, and not scripts/check_refs.py's old regex-based declaration
# matching, is the load-bearing declaration-coverage gate.
[[lean_exe]]
name = "check_refs_coverage_full"
root = "Tools.CheckRefsCoverage"

# P4/P5 unified x86-64 instruction obligation gate: every registered instance must declare a
# named validation oracle (silicon or NASM) and a cost
# coefficient provenance (cited or an honest model-internal marker). See
# Tools/CheckX86Obligations.lean for the full specification and
# docs/X86_ISA_EXPANSION_PREREQUISITES.md P4/P5 for the prerequisite this closes.
[[lean_exe]]
name = "check_x86_obligations"
root = "Tools.CheckX86Obligations"

# Unified AArch64 instruction obligation gate: validates codec roundtrip, operational semantics,
# micro-op decomposition, oracle validation, and cost provenance across all registered instructions.
[[lean_exe]]
name = "check_aarch64_obligations"
root = "Tools.CheckAArch64Obligations"

