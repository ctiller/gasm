# gasm CI - Pillar 1 mechanical gates (docs/REVIEW.md #4.1). Design rationale,
# the platform-matrix justification (why Linux's step list differs from
# Windows's), the caching soundness argument, the push/PR/schedule cost split,
# and every currently-known gap are documented in docs/CI.md -- read that
# before changing this file.
#
# Exit-code discipline (docs/CI.md #8): one gate per step, so GitHub Actions checks
# that single command's exit code directly. Never pipe a gate's output through
# anything (tee, a pager, `| findstr`, ...) before its exit code is read --
# that is the exact bug this project has already shipped once. Steps that
# must run more than one native command re-raise the exit code explicitly
# (`exit $LASTEXITCODE` on pwsh; bash's default `-e` already does this).

name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on feature branches and PRs, but NEVER on main:
  # main is pushed to by more than one party, and a cancelled run leaves that
  # commit with no verification record at all. A cancelled job also reports its
  # in-flight step as a red X, which is indistinguishable at a glance from a
  # genuine gate failure -- that has already caused two misdiagnoses here.
  # Letting main runs finish costs runner minutes and buys an unambiguous
  # per-commit signal, which is the point of having CI at all.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned oracle versions prevent environment drift from silently changing gate
  # results. Bump deliberately; never let a runner
  # image's default just be whatever it happens to ship.
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------
  # Linters: fast standalone Python validation across all 7 linter gates.
  # Runs on ubuntu-latest in parallel without waiting for Lean builds.
  # ---------------------------------------------------------------------
  linters:
    name: Linters (parallel Python gates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run all linters concurrently in parallel
        shell: bash
        run: |
          python scripts/run_gates.py --group linters \
            --gate check_refs \
            --gate check_full_refs_gate_wiring \
            --gate check_gates \
            --gate check_publishable \
            --gate check_licenses \
            --gate check_doc_facade \
            --gate check_orphan_modules \
            --gate check_instructions_umbrella \
            --parallel

  # ---------------------------------------------------------------------
  # Proofs: Lean kernel verification, axiom audit, coverage, and obligations.
  # Runs concurrently across Windows and Linux.
  # ---------------------------------------------------------------------
  proofs:
    name: Proofs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager) [Windows]
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1" -OutFile elan-init.ps1
          ./elan-init.ps1 -NoPrompt 1 -DefaultToolchain none
          "$HOME\.elan\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install elan (Lean toolchain manager) [Linux]
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Cache Lake build artifacts
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml', 'lake-manifest.json') }}-${{ hashFiles('Gasm/**/*.lean', 'Stdlib/**/*.lean', 'Spikes/**/*.lean', 'Tools/**/*.lean', '*.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml', 'lake-manifest.json') }}-
            ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-
            ${{ runner.os }}-lake-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Memory-bounded build (all defaultTargets)
        shell: bash
        run: python scripts/build_full.py

      - name: Run proofs & obligations in parallel
        shell: bash
        run: python scripts/run_gates.py --group proofs --parallel

  # ---------------------------------------------------------------------
  # Spikes: executable targets and Stdlib unit test suites.
  # ---------------------------------------------------------------------
  spikes:
    name: Spikes & Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager) [Windows]
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1" -OutFile elan-init.ps1
          ./elan-init.ps1 -NoPrompt 1 -DefaultToolchain none
          "$HOME\.elan\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install elan (Lean toolchain manager) [Linux]
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Cache Lake build artifacts
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml', 'lake-manifest.json') }}-${{ hashFiles('Gasm/**/*.lean', 'Stdlib/**/*.lean', 'Spikes/**/*.lean', 'Tools/**/*.lean', '*.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml', 'lake-manifest.json') }}-
            ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-
            ${{ runner.os }}-lake-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install QEMU [Linux]
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-user

      - name: Memory-bounded build (all defaultTargets)
        shell: bash
        run: python scripts/build_full.py

      - name: Fast Stdlib unit suite (Push mode)
        if: github.event_name == 'push'
        shell: bash
        run: |
          python scripts/run_gates.py --group spikes \
            --gate test_zlib \
            --gate test_png \
            --gate test_smolalloc \
            --parallel

      - name: Full Spike execution in parallel [Windows] (PR / Workflow Dispatch)
        if: github.event_name != 'push' && runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/run_gates.py --group spikes `
            --gate test_zlib `
            --gate test_png `
            --gate test_smolalloc `
            --gate test_spike1_windows `
            --gate test_spike2_windows `
            --gate test_spike3_windows `
            --gate test_spike4 `
            --gate test_spike5 `
            --gate test_spike1_wasm `
            --gate test_spike2_wasm `
            --gate test_spike3_wasm `
            --parallel

      - name: Full Spike execution in parallel [Linux] (PR / Workflow Dispatch)
        if: github.event_name != 'push' && runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/run_gates.py --group spikes \
            --gate test_zlib \
            --gate test_png \
            --gate test_smolalloc \
            --gate test_spike1_baremetal \
            --gate test_spike1_aarch64_baremetal \
            --gate test_spike1_aarch64_linux \
            --gate test_spike1_wasm \
            --gate test_spike2_wasm \
            --gate test_spike3_wasm \
            --parallel

  # ---------------------------------------------------------------------
  # Fuzzers: Differential & stability fuzzers sharded across CI workers.
  # Executed on PR & workflow_dispatch only.
  # ---------------------------------------------------------------------
  fuzzers:
    name: Fuzzers (${{ matrix.os }}, shard ${{ matrix.shard }})
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        shard: ["1/2", "2/2"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager) [Windows]
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1" -OutFile elan-init.ps1
          ./elan-init.ps1 -NoPrompt 1 -DefaultToolchain none
          "$HOME\.elan\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install elan (Lean toolchain manager) [Linux]
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Cache Lake build artifacts
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml', 'lake-manifest.json') }}-${{ hashFiles('Gasm/**/*.lean', 'Stdlib/**/*.lean', 'Spikes/**/*.lean', 'Tools/**/*.lean', '*.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml', 'lake-manifest.json') }}-
            ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-
            ${{ runner.os }}-lake-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install NASM (encoding_fuzzer oracle) [Windows]
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nasm -y --no-progress

      - name: Install NASM (encoding_fuzzer oracle) [Linux]
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Memory-bounded build (all defaultTargets)
        shell: bash
        run: python scripts/build_full.py

      - name: Run Fuzzers Shard in Parallel [Windows]
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/run_gates.py --group fuzzers --shard ${{ matrix.shard }} --parallel

      - name: Run Fuzzers Shard in Parallel [Linux]
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/run_gates.py --group fuzzers \
            --gate wasm_fuzzer \
            --gate encoding_fuzzer \
            --gate gzip_fuzzer \
            --gate png_stability_fuzzer \
            --gate x86_stability_fuzzer \
            --gate elf_stability_fuzzer \
            --shard ${{ matrix.shard }} \
            --parallel
